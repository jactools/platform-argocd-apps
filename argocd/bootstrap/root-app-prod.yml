apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jactools/platform-argocd-apps.git
    targetRevision: HEAD
    path: argocd/bootstrap/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
