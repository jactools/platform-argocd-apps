apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-bootstrap-prod-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: file:///repos/platform-argocd-apps
        revision: HEAD
        files:
          - path: apps/platform/shared/argocd/shared-prod.yml
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: argocd
    spec:
      project: '{{.spec.project}}'
      source:
        repoURL: '{{if hasPrefix .path.path "apps/platform/"}}file:///repos/platform-argocd-apps{{else if hasPrefix .path.path "apps/tenants/dq/"}}file:///repos/dq-made-easy{{else if hasPrefix .path.path "apps/tenants/maas/"}}file:///repos/metadata-as-a-service{{end}}'
        targetRevision: '{{.spec.source.targetRevision}}'
        path: '{{.spec.source.path}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          {{- if hasPrefix .metadata.name "platform-shared" }}
          - RespectIgnoreDifferences=true
          {{- end }}