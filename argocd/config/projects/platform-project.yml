---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform services managed by platform-foundation
  sourceRepos:
    - file:///repos/platform-argocd-apps
  destinations:
    - namespace: platform-kong
      server: '*'
    - namespace: platform-keycloak
      server: '*'
    - namespace: platform-airflow
      server: '*'
    - namespace: platform-observability
      server: '*'
    - namespace: platform-kafka
      server: '*'
    - namespace: platform-trino
      server: '*'
    - namespace: platform-redis
    - namespace: platform-ai-stor
      server: '*'
    - namespace: platform-shared
      server: '*'
    - namespace: platform-tls
      server: '*'
    - namespace: platform-registry
      server: '*'
    - namespace: platform-ingestion
      server: '*'
    - namespace: kyverno
      server: '*'
    - namespace: platform-eso
      server: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret
