services:
  docker-registry:
    image: ${REGISTRY_IMAGE}
    container_name: ${REGISTRY_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Platform Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    expose:
      - "5000"
    volumes:
      - ${REGISTRY_DATA_DIR}:/var/lib/registry
      - ${REGISTRY_AUTH_FILE}:/auth/htpasswd:ro
    networks:
      - registries
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  packages-registry:
    image: ${PYPI_IMAGE}
    container_name: ${PYPI_CONTAINER_NAME}
    restart: unless-stopped
    command:
      - run
      - -P
      - /data/.htpasswd
      - -a
      - ${PYPI_AUTH_MODE}
      - -p
      - "8080"
      - /data/packages
    expose:
      - "8080"
    volumes:
      - ${PYPI_DATA_DIR}:/data/packages
      - ${PYPI_AUTH_FILE}:/data/.htpasswd:ro
    networks:
      - registries
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  docker-registry-gateway:
    image: ${NGINX_IMAGE}
    container_name: ${REGISTRY_GATEWAY_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - docker-registry
    ports:
      - ${REGISTRY_HOST_PORT}:5000
    volumes:
      - ./nginx/docker-registry.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REGISTRY_TLS_CERT_FILE}:/certs/tls.crt:ro
      - ${REGISTRY_TLS_KEY_FILE}:/certs/tls.key:ro
    networks:
      - registries
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  packages-gateway:
    image: ${NGINX_IMAGE}
    container_name: ${PYPI_GATEWAY_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - packages-registry
    ports:
      - ${PYPI_HOST_PORT}:443
    volumes:
      - ./nginx/packages.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PYPI_TLS_CERT_FILE}:/certs/tls.crt:ro
      - ${PYPI_TLS_KEY_FILE}:/certs/tls.key:ro
    networks:
      - registries
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  registries:
    name: ${COMPOSE_PROJECT_NAME}_registries