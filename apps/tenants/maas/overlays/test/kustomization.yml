apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maas-test

commonLabels:
  platform.jaccloud.nl/environment: test

resources:
  - ../../base

# Rename the base namespace 'maas' to 'maas-test'
patches:
  - target:
      kind: Namespace
      name: maas
    patch: |
      - op: replace
        path: /metadata/name
        value: maas-test
