apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tenant: maas (metadata-as-a-service)
# Base — namespace and shared labels only.
# Service manifests (Deployment, Service, Ingress) live in the consumer repo
# and are referenced by ArgoCD Applications in argocd/.

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/tenant: maas

resources:
  - namespace.yml
