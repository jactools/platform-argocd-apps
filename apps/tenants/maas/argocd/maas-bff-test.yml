---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-maas-bff-test
  namespace: argocd
spec:
  project: tenant
  source:
    repoURL: "{{MAAS_REPO_URL}}"
    targetRevision: feature/prototype
    path: k8s/overlays/test-bff
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
