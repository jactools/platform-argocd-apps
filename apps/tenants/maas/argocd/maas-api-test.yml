---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-maas-api-test
  namespace: argocd
spec:
  project: maas
  source:
    repoURL: https://github.com/jactools/metadata-as-a-service.git
    targetRevision: release/test
    path: packages/metadata-api/interface/api/argocd/test
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true