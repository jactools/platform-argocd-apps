---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-maas-central-repo
  namespace: argocd
spec:
  project: maas
  source:
    repoURL: file:///repos/metadata-as-a-service
    targetRevision: release/dev
    path: packages/metadata-central-repo/interface/api/argocd/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true