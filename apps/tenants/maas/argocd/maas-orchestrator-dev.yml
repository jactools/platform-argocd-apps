---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-maas-orchestrator
  namespace: argocd
spec:
  project: maas
  source:
    repoURL: file:///repos/metadata-as-a-service
    targetRevision: feature/prototype
    path: k8s/overlays/dev-orchestrator
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
