---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-dq-dev
  namespace: argocd
spec:
  project: dq
  source:
    repoURL: file:///repos/dq-made-easy
    targetRevision: release/dev
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dq-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true