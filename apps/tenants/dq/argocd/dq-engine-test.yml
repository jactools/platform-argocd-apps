---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-dq-engine-test
  namespace: argocd
spec:
  project: tenant
  source:
    repoURL: "{{DQ_MADE_EASY_REPO_URL}}"
    targetRevision: HEAD
    path: k8s/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: dq-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
