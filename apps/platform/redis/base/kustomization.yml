apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Redis
# Base manifests — TLS, trust bundle, and ACL secrets generated by platform scripts

labels:
  - pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/service: redis
      platform.jaccloud.nl/tenant: platform
    includeSelectors: true

resources:
  - namespace.yml
  - configmap.yml
  - deployment.yml
  - service.yml

patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
