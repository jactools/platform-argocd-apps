apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Docker Registry
# Secrets (docker-registry-tls) generated by scripts/generate_secrets.sh

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/service: docker-registry
  platform.jaccloud.nl/tenant: platform

resources:
  - namespace.yml
  - deployment.yml
  - service.yml
  - ingress.yml

# Required platform annotations on workloads
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
