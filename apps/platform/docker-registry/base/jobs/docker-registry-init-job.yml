apiVersion: batch/v1
kind: Job
metadata:
  name: docker-registry-secret-init
  namespace: platform-registry
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    platform.jaccloud.nl/target-id: CLUSTER
    platform.jaccloud.nl/workload-kind: job
    platform.jaccloud.nl/maas-register: "true"
  labels:
    platform.jaccloud.nl/managed-by: argocd
    platform.jaccloud.nl/service: docker-registry
    platform.jaccloud.nl/tenant: platform
spec:
  template:
    metadata:
      annotations:
        platform.jaccloud.nl/target-id: CLUSTER
        platform.jaccloud.nl/workload-kind: job
        platform.jaccloud.nl/maas-register: "true"
      labels:
        platform.jaccloud.nl/managed-by: argocd
        platform.jaccloud.nl/service: docker-registry
        platform.jaccloud.nl/tenant: platform
    spec:
      serviceAccountName: docker-registry-init-sa
      containers:
        - name: generate-secrets
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/generate_secrets.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: docker-registry-init-script
            defaultMode: 0755

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docker-registry-init-sa
  namespace: platform-registry

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docker-registry-init-role
  namespace: platform-registry
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: docker-registry-init-binding
  namespace: platform-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: docker-registry-init-role
subjects:
  - kind: ServiceAccount
    name: docker-registry-init-sa
    namespace: platform-registry