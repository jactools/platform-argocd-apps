---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pypi-server
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: "<HOST>"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pypi-server
                port:
                  number: 8080
    - host: "<HOST_HOST>"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pypi-server
                port:
                  number: 8080
