apiVersion: v1
kind: ConfigMap
metadata:
  name: pypi-init-script
  namespace: platform-registry
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
data:
  generate_secrets.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log()  { printf '[init] %s\n' "$*" >&2; }
    info() { printf '[init] ✓ %s\n' "$*" >&2; }

    secret_exists() {
      kubectl get secret pypi-server-auth -n platform-registry >/dev/null 2>&1
    }

    generate_secret() {
      local username="pypi-admin"
      local password
      password=$(openssl rand -base64 24)

      # Generate Apache MD5 password (works with pypiserver htpasswd)
      local htpasswd_content
      htpasswd_content="${username}:"$(openssl passwd -apr1 "$password")

      kubectl -n platform-registry create secret generic pypi-server-auth \
        --from-literal=htpasswd="$htpasswd_content" \
        --from-literal=username="$username" \
        --from-literal=password="$password" \
        --dry-run=client -o yaml | kubectl apply -f - >/dev/null
    }

    main() {
      log "Starting PyPI server secret initialization..."

      if secret_exists; then
        info "Secret platform-registry/pypi-server-auth already exists"
        return 0
      fi

      generate_secret
      info "Created secret platform-registry/pypi-server-auth"
    }

    main "$@"
