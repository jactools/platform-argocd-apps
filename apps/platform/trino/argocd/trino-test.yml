---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-trino
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/jactools/platform-argocd-apps.git
    targetRevision: feature/prototype
    path: apps/platform/trino/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-trino
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
