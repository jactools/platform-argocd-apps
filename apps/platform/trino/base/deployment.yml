---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: query-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: query-engine
    spec:
      containers:
        - name: trino
          image: jacbeekers/platform-trino:0.1.0
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trino-config
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: trino-data
              mountPath: /var/trino/data
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: trino-data
          emptyDir: {}
