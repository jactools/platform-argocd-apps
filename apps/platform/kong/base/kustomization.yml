apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Kong API Gateway
# Base manifests — secrets generated by scripts/generate_secrets.sh

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/service: kong
  platform.jaccloud.nl/tenant: platform

resources:
  - namespace.yml
  - configmap.yml
  - kong-db.yml
  - kong-migrations.yml
  - deployment.yml
  - service.yml
  - ingress.yml

# Required platform annotations on workloads
patches:
  - target:
      kind: ConfigMap
      name: kong-config
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
  - target:
      kind: Deployment
      name: kong-db
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-2"
  - target:
      kind: Service
      name: kong-db
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: StatefulSet
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
  - target:
      kind: Job
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: job
          platform.jaccloud.nl/maas-register: "false"
  - target:
      kind: Job
      name: kong-migrations
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-1"
  - target:
      kind: Deployment
      name: kong
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "0"
