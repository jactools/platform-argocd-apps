apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Kong API Gateway
# Base manifests — secrets generated by scripts/generate_secrets.sh
#
# Flux ordering is handled by split Kustomizations with dependsOn:
#   platform-kong-db.yaml → platform-kong-migrations.yaml → platform-kong.yaml

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/service: kong
  platform.jaccloud.nl/tenant: platform

resources:
  - namespace.yml
  - configmap.yml
  - kong-db-pvc.yml
  - kong-db.yml
  - kong-migrations.yml
  - deployment.yml
  - service.yml
  - ingress.yml

# Required platform annotations on workloads
patches:
  - target:
      kind: ConfigMap
      name: kong-config
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
  - target:
      kind: Deployment
      name: kong-db
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
  - target:
      kind: Service
      name: kong-db
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
  - target:
      kind: StatefulSet
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
  - target:
      kind: Job
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: job
          platform.jaccloud.nl/maas-register: "false"
  - target:
      kind: Job
      name: kong-migrations-bootstrap
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
  - target:
      kind: Deployment
      name: kong
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
