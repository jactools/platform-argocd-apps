---
# Kong proxy — exposed via Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-proxy
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "<HOST>"
      secretName: platform-kong-tls
  rules:
    - host: "<HOST>"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port:
                  number: 8000
---
# Kong Manager (web UI)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-manager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "<HOST>"
      secretName: platform-kong-tls
  rules:
    - host: "<HOST>"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-manager
                port:
                  number: 8002
