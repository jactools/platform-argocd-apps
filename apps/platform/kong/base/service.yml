---
# Kong proxy — exposed via Ingress
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
spec:
  type: ClusterIP
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: kong
---
# Kong admin API — internal only
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: 8444
      targetPort: 8444
      protocol: TCP
  selector:
    app.kubernetes.io/name: kong
---
# Kong Manager (web UI)
apiVersion: v1
kind: Service
metadata:
  name: kong-manager
spec:
  type: ClusterIP
  ports:
    - name: manager
      port: 8002
      targetPort: 8002
      protocol: TCP
  selector:
    app.kubernetes.io/name: kong
