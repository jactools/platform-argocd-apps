---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: kong
          image: jacbeekers/platform-kong:0.1.0
          command: ["/docker-entrypoint.sh"]
          args: ["kong", "docker-start"]
          ports:
            - containerPort: 8000
              name: proxy
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8444
              name: admin
              protocol: TCP
          env:
            - name: KONG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DATABASE
            - name: KONG_PG_HOST
              value: "kong-db"
            - name: KONG_PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_PG_PORT
            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kong-db-credentials
                  key: KONG_PG_DATABASE
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: kong-db-credentials
                  key: KONG_PG_USER
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-db-credentials
                  key: KONG_PG_PASSWORD
            - name: KONG_PROXY_LISTEN
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_PROXY_LISTEN
            - name: KONG_PROXY_ACCESS_LOG
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_PROXY_ACCESS_LOG
            - name: KONG_ADMIN_ACCESS_LOG
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_ADMIN_ACCESS_LOG
            - name: KONG_PROXY_ERROR_LOG
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_PROXY_ERROR_LOG
            - name: KONG_ADMIN_ERROR_LOG
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_ADMIN_ERROR_LOG
            - name: KONG_ADMIN_LISTEN
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_ADMIN_LISTEN
            - name: KONG_DNS_VALID_TTL
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DNS_VALID_TTL
            - name: KONG_DNS_STALE_TTL
              valueFrom:
                configMapKeyRef:
                  name: kong-config
                  key: KONG_DNS_STALE_TTL
          readinessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
