apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-kong

commonLabels:
  platform.jaccloud.nl/environment: test

resources:
  - ../../base

# Test-specific Kong image (pulled from test registry)
images:
  - name: kong:3.10
    newName: docker-registry.jacloud.nl:5000/jacbeekers/platform-kong
    newTag: "0.1.0"
  - name: postgres:17-bookworm
    newName: docker-registry.jacloud.nl:5000/jacbeekers/postgres
    newTag: "17-alpine"

# Test ingress hostname
patches:
  - target:
      kind: Ingress
      name: kong-proxy
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: kong.jacloud.nl
