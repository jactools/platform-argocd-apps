apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-kong

commonLabels:
  platform.jaccloud.nl/environment: dev

resources:
  - ../../base

# Use official Kong image for now — swap to custom platform-kong image when built
# images:
#   - name: kong:3.9
#     newName: docker-registry.dev.jac.dot:5000/jacbeekers/platform-kong
#     newTag: "0.1.0"

# Dev ingress hostname
patches:
  - target:
      kind: Ingress
      name: kong-proxy
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: kong.dev.jac.dot
