# Kong DB — namespace, configmap, PVC, DB deployment/service
# Flux ordering: platform-kong-db → platform-kong-migrations → platform-kong

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-kong

commonLabels:
  platform.jaccloud.nl/environment: dev

resources:
  - ../../base/namespace.yml
  - ../../base/configmap.yml
  - ../../base/kong-db-pvc.yml
  - ../../base/kong-db.yml

images:
  - name: postgres:17-bookworm
    newName: docker-registry.dev.jac.dot:10443/postgres
    newTag: "17-bookworm"
