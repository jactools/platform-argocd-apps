---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start", "--import-realm", "--http-relative-path=/auth"]
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME_STRICT
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_HOSTNAME_STRICT
            - name: KC_HTTPS_RELATIVE_PATH
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_HTTP_RELATIVE_PATH
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB
            - name: KC_DB_URL_HOST
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB_URL_HOST
            - name: KC_DB_URL_PORT
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB_URL_PORT
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: KC_DB_PASSWORD
            - name: KC_DB_URL_SSL
              value: "true"
            - name: KC_DB_URL_SSL_ROOT_CERT
              value: "/etc/keycloak/certs/ca.crt"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: "/etc/keycloak/certs/tls/tls.crt"
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: "/etc/keycloak/certs/tls/tls.key"
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /auth/realms/master/.well-known/openid-configuration
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /auth/realms/master
              port: 8443
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/keycloak/certs/tls
              readOnly: true
            - name: truststore
              mountPath: /etc/keycloak/certs
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/realm-import
      volumes:
        - name: tls-certs
          secret:
            secretName: keycloak-tls
        - name: truststore
          secret:
            secretName: keycloak-truststore
        - name: realm-import
          emptyDir: {}
