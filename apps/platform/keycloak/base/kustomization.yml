apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Keycloak SSO
# Base manifests — secrets generated by scripts/generate_secrets.sh

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/service: keycloak
  platform.jaccloud.nl/tenant: platform

resources:
  - namespace.yml
  - configmap.yml
  - keycloak-db.yml
  - deployment.yml
  - service.yml
  - ingress.yml
