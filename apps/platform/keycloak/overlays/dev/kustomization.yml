apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-keycloak

commonLabels:
  platform.jaccloud.nl/environment: dev

resources:
  - ../../base

# Use official Keycloak image for now — swap to custom platform-keycloak when built
# images:
#   - name: quay.io/keycloak/keycloak:26.0
#     newName: docker-registry.dev.jac.dot:5000/jacbeekers/platform-keycloak
#     newTag: "0.1.0"

# Dev ingress hostname
patches:
  - target:
      kind: Ingress
      name: keycloak
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: keycloak.dev.jac.dot
