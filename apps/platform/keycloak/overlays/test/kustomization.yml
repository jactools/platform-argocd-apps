apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-keycloak

commonLabels:
  platform.jaccloud.nl/environment: test

resources:
  - ../../base

# Test-specific Keycloak image
images:
  - name: quay.io/keycloak/keycloak:26.0
    newName: docker-registry.jacloud.nl:5000/jacbeekers/platform-keycloak
    newTag: "0.1.0"

# Test ingress hostname
patches:
  - target:
      kind: Ingress
      name: keycloak
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: keycloak.jacloud.nl
