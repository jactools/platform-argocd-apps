---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "{{ARGOCD_REPO_URL}}"
    targetRevision: HEAD
    path: apps/platform/observability/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
