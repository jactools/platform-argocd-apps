apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-llm

commonLabels:
  platform.jaccloud.nl/environment: test

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: llm
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: llm.test.jac.dot
