apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-dockerhub-images
  annotations:
    policies.kyverno.io/title: Block Public Registry Images
    policies.kyverno.io/category: Platform Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Blocks all container images from public registries (docker.io, ghcr.io).
      All images must be pulled from the local docker-registry or loaded
      into the cluster via `kind load docker-image`.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-dockerhub-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - argocd
                - ingress-nginx
                - cert-manager
                - kube-system
                - kube-public
                - kube-node-lease
                - local-path-storage
      validate:
        message: "Images from docker.io are forbidden. Use the local docker-registry or load images via `kind load docker-image`."
        allowExistingViolations: false
        pattern:
          spec:
            containers:
              - image: "!docker.io/*"
            =(initContainers):
              - image: "!docker.io/*"

    - name: deny-ghcr-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - argocd
                - ingress-nginx
                - cert-manager
                - kube-system
                - kube-public
                - kube-node-lease
                - local-path-storage
      validate:
        message: "Images from ghcr.io are forbidden. Use the local docker-registry or load images via `kind load docker-image`."
        allowExistingViolations: false
        pattern:
          spec:
            containers:
              - image: "!ghcr.io/*"
            =(initContainers):
              - image: "!ghcr.io/*"

    - name: deny-short-image-names
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kyverno
                - argocd
                - ingress-nginx
                - cert-manager
                - kube-system
                - kube-public
                - kube-node-lease
                - local-path-storage
      validate:
        message: >-
          Short image names (e.g. 'nginx') default to docker.io.
          Use fully-qualified image names from the local docker-registry.
        allowExistingViolations: false
        pattern:
          spec:
            containers:
              - image: "*/*"
            =(initContainers):
              - image: "*/*"
