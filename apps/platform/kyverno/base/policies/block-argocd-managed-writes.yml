apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-managed-writes
  annotations:
    policies.kyverno.io/title: Block Managed Writes
    policies.kyverno.io/category: Platform Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Blocks direct kubectl writes from human users to platform-managed
      namespaces. Changes must flow through Git and Flux reconciliation.
      Tenant namespaces (dq-*, maas-*) allow writes for bootstrap.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-human-writes-to-platform-namespaces
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - argocd
                - kyverno
                - platform-kong
                - platform-keycloak
                - platform-observability
                - platform-redis
                - platform-tls
                - platform-shared
                - platform-ai-stor
                - platform-airflow
                - platform-kafka
                - platform-eso
      validate:
        message: >-
          Platform namespace changes must go through Git. Direct kubectl writes are blocked.
        deny:
          conditions:
            any:
              - key: "{{ starts_with(request.userInfo.username, 'system:') }}"
                operator: Equals
                value: false

    - name: deny-human-writes-to-platform-resources
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
                - Deployment
                - HorizontalPodAutoscaler
                - Ingress
                - Job
                - NetworkPolicy
                - PersistentVolumeClaim
                - PodDisruptionBudget
                - Role
                - RoleBinding
                - Secret
                - Service
                - ServiceAccount
              namespaces:
                - argocd
                - kyverno
                - platform-kong
                - platform-keycloak
                - platform-observability
                - platform-redis
                - platform-tls
                - platform-shared
                - platform-ai-stor
                - platform-airflow
                - platform-kafka
                - platform-eso
      validate:
        message: >-
          Platform-managed resources must be updated through Git. Direct kubectl writes are blocked.
        deny:
          conditions:
            any:
              - key: "{{ starts_with(request.userInfo.username, 'system:') }}"
                operator: Equals
                value: false

    - name: deny-human-writes-to-managed-clusterpolicies
      match:
        any:
          - resources:
              kinds:
                - ClusterPolicy
              names:
                - block-dockerhub-images
                - block-managed-writes
      validate:
        message: >-
          Kyverno policies are Git-managed and must be changed through Git.
        deny:
          conditions:
            any:
              - key: "{{ starts_with(request.userInfo.username, 'system:') }}"
                operator: Equals
                value: false
