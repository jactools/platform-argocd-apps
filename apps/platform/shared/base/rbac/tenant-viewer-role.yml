# Tenant Viewer Role
# Scope: tenant-namespace-scoped read-only role for tenant troubleshooting and support
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-viewer
  labels:
    app.kubernetes.io/part-of: platform-foundation
    app.kubernetes.io/component: rbac
rules:
  # Read-only access to core resources
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  # Read-only access to workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read-only access to batch
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Read-only access to networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
