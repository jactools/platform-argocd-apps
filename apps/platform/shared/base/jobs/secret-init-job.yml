apiVersion: batch/v1
kind: Job
metadata:
  name: secret-init
  namespace: platform-shared
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    platform.jaccloud.nl/managed-by: argocd
    platform.jaccloud.nl/service: shared-init
spec:
  template:
    metadata:
      labels:
        platform.jaccloud.nl/managed-by: argocd
        platform.jaccloud.nl/service: shared-init
    spec:
      serviceAccountName: secret-init-sa
      containers:
      - name: generate-secrets
        image: bitnami/kubectl:latest
        command: ["/bin/bash", "/scripts/generate_secrets.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: scripts
        configMap:
          name: secret-init-script
          defaultMode: 0755

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-init-sa
  namespace: platform-shared
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-5"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-init-role
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-5"
rules:
- apiGroups: [""]
  resources: ["namespaces", "secrets"]
  verbs: ["get", "create", "update", "patch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-init-binding
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-init-role
subjects:
- kind: ServiceAccount
  name: secret-init-sa
  namespace: platform-shared
