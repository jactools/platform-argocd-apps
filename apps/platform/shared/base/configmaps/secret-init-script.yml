apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-init-script
  namespace: platform-shared
data:
  generate_secrets.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log()  { printf '[init] %s\n' "$*" >&2; }
    info() { printf '[init] ✓ %s\n' "$*" >&2; }
    warn() { printf '[init] ⚠ %s\n' "$*" >&2; }
    err()  { printf '[init] ✗ %s\n' "$*" >&2; }

    get_or_gen_password() {
      local secret_name="$1"
      local namespace="$2"
      local key="$3"
      local existing
      existing=$(kubectl get secret "$secret_name" -n "$namespace" -o jsonpath="{.data.$key}" 2>/dev/null | base64 -d 2>/dev/null || true)
      if [[ -n "$existing" ]]; then
        echo "$existing"
      else
        openssl rand -base64 32
      fi
    }

    ensure_namespace() {
      local ns="$1"
      kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null || true
    }

    apply_secret() {
      local name="$1"
      local namespace="$2"
      shift 2
      local literals=("$@")

      local cmd="kubectl -n $namespace create secret generic $name"
      for lit in "${literals[@]}"; do
        cmd="$cmd --from-literal=$lit"
      done
      cmd="$cmd --dry-run=client -o yaml | kubectl apply -f -"

      if eval "$cmd" 2>/dev/null; then
        info "Created/updated secret $namespace/$name"
      else
        warn "Failed to create/update secret $namespace/$name"
      fi
    }

    main() {
      log "Starting platform secret initialization..."

      ensure_namespace platform-kong
      ensure_namespace platform-keycloak
      ensure_namespace platform-observability
      ensure_namespace platform-redis

      # --- Kong ---
      local kong_db_password
      kong_db_password=$(get_or_gen_password "kong-db-credentials" platform-kong "POSTGRES_PASSWORD")
      apply_secret kong-db-credentials platform-kong \
        "POSTGRES_DB=kong" \
        "POSTGRES_USER=kong" \
        "POSTGRES_PASSWORD=$kong_db_password" \
        "KONG_PG_DATABASE=kong" \
        "KONG_PG_USER=kong" \
        "KONG_PG_PASSWORD=$kong_db_password"

      local kong_admin_password
      kong_admin_password=$(get_or_gen_password "kong-admin-credentials" platform-kong "ADMIN_PASSWORD")
      apply_secret kong-admin-credentials platform-kong \
        "ADMIN_USERNAME=admin" \
        "ADMIN_PASSWORD=$kong_admin_password"

      # --- Keycloak ---
      local keycloak_admin_password
      keycloak_admin_password=$(get_or_gen_password "keycloak-admin" platform-keycloak "KEYCLOAK_ADMIN_PASSWORD")
      apply_secret keycloak-admin platform-keycloak \
        "KEYCLOAK_ADMIN=admin" \
        "KEYCLOAK_ADMIN_PASSWORD=$keycloak_admin_password"

      local keycloak_db_password
      keycloak_db_password=$(get_or_gen_password "keycloak-db-credentials" platform-keycloak "POSTGRES_PASSWORD")
      apply_secret keycloak-db-credentials platform-keycloak \
        "POSTGRES_DB=keycloak" \
        "POSTGRES_USER=keycloak" \
        "POSTGRES_PASSWORD=$keycloak_db_password" \
        "KC_DB_USERNAME=keycloak" \
        "KC_DB_PASSWORD=$keycloak_db_password"

      # --- Grafana ---
      local grafana_password
      grafana_password=$(get_or_gen_password "grafana-admin" platform-observability "GF_SECURITY_ADMIN_PASSWORD")
      apply_secret grafana-admin platform-observability \
        "GF_SECURITY_ADMIN_USER=admin" \
        "GF_SECURITY_ADMIN_PASSWORD=$grafana_password"

      # --- Redis (Platform Admin + Per-Principal) ---
      local redis_admin_password
      redis_admin_password=$(get_or_gen_password "redis-credentials" platform-redis "REDIS_ADMIN_PASSWORD")
      apply_secret redis-credentials platform-redis \
        "REDIS_ADMIN_USERNAME=platform-admin" \
        "REDIS_ADMIN_PASSWORD=$redis_admin_password"

      local dq_api_password
      dq_api_password=$(get_or_gen_password "redis-credentials-dq-api" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-api platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-api" \
        "REDIS_PASSWORD=$dq_api_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      local dq_engine_password
      dq_engine_password=$(get_or_gen_password "redis-credentials-dq-engine" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-engine platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-engine" \
        "REDIS_PASSWORD=$dq_engine_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      local dq_profiling_password
      dq_profiling_password=$(get_or_gen_password "redis-credentials-dq-profiling" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-profiling platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-profiling" \
        "REDIS_PASSWORD=$dq_profiling_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      # --- Redis ACL ---
      local acl_content
      acl_content=$(printf '%s\n' \
        'user default off' \
        "user platform-admin on >${redis_admin_password} ~* &* +@all" \
        "user dq-api on >${dq_api_password} ~dq-made-easy:* +@all" \
        "user dq-engine on >${dq_engine_password} ~dq-made-easy:* +@all" \
        "user dq-profiling on >${dq_profiling_password} ~dq-made-easy:* +@all"
      )
      apply_secret redis-acl platform-redis "users.acl=$acl_content"

      info "All platform secrets initialized"
    }

    main "$@"
