apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-init-script
  namespace: platform-shared
data:
  generate_secrets.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log()  { printf '[init] %s\n' "$*" >&2; }
    info() { printf '[init] ✓ %s\n' "$*" >&2; }
    warn() { printf '[init] ⚠ %s\n' "$*" >&2; }
    err()  { printf '[init] ✗ %s\n' "$*" >&2; }

    get_or_gen_password() {
      local secret_name="$1"
      local namespace="$2"
      local key="$3"
      local existing
      existing=$(kubectl get secret "$secret_name" -n "$namespace" -o jsonpath="{.data.$key}" 2>/dev/null | base64 -d 2>/dev/null || true)
      if [[ -n "$existing" ]]; then
        echo "$existing"
      else
        openssl rand -base64 32
      fi
    }

    ensure_namespace() {
      local ns="$1"
      kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null || true
    }

    apply_secret() {
      local name="$1"
      local namespace="$2"
      shift 2
      local literals=("$@")
      local tmp_dir
      tmp_dir="$(mktemp -d)"
      local cmd=(kubectl -n "$namespace" create secret generic "$name")
      local literal key value file_path

      for literal in "${literals[@]}"; do
        key="${literal%%=*}"
        value="${literal#*=}"
        if [[ "$value" == *$'\n'* ]]; then
          file_path="$tmp_dir/$key"
          printf '%s' "$value" > "$file_path"
          cmd+=(--from-file="$key=$file_path")
        else
          cmd+=(--from-literal="$key=$value")
        fi
      done

      if "${cmd[@]}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1; then
        info "Created/updated secret $namespace/$name"
      else
        warn "Failed to create/update secret $namespace/$name"
      fi

      rm -rf "$tmp_dir"
    }

    apply_configmap() {
      local name="$1"
      local namespace="$2"
      shift 2
      local literals=("$@")
      local tmp_dir
      tmp_dir="$(mktemp -d)"
      local cmd=(kubectl -n "$namespace" create configmap "$name")
      local literal key value file_path

      for literal in "${literals[@]}"; do
        key="${literal%%=*}"
        value="${literal#*=}"
        if [[ "$value" == *$'\n'* ]]; then
          file_path="$tmp_dir/$key"
          printf '%s' "$value" > "$file_path"
          cmd+=(--from-file="$key=$file_path")
        else
          cmd+=(--from-literal="$key=$value")
        fi
      done

      if "${cmd[@]}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1; then
        info "Created/updated configmap $namespace/$name"
      else
        warn "Failed to create/update configmap $namespace/$name"
      fi

      rm -rf "$tmp_dir"
    }

    apply_tls_secret() {
      local name="$1"
      local namespace="$2"
      local cert_file="$3"
      local key_file="$4"

      if kubectl -n "$namespace" create secret tls "$name" --cert="$cert_file" --key="$key_file" --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1; then
        info "Created/updated TLS secret $namespace/$name"
      else
        warn "Failed to create/update TLS secret $namespace/$name"
      fi
    }

    ensure_redis_tls_material() {
      if kubectl get secret redis-tls -n platform-redis >/dev/null 2>&1 && kubectl get configmap platform-root-ca -n platform-redis >/dev/null 2>&1; then
        info "Redis TLS secret and CA configmap already exist"
        return 0
      fi

      local tmp_dir ca_key ca_cert redis_key redis_csr redis_cert redis_ext
      tmp_dir="$(mktemp -d)"
      ca_key="$tmp_dir/redis-ca.key"
      ca_cert="$tmp_dir/rootCA.pem"
      redis_key="$tmp_dir/redis.key"
      redis_csr="$tmp_dir/redis.csr"
      redis_cert="$tmp_dir/redis.crt"
      redis_ext="$tmp_dir/redis.ext"

      printf '%s\n' \
        'basicConstraints = CA:FALSE' \
        'keyUsage = critical,digitalSignature,keyEncipherment' \
        'extendedKeyUsage = serverAuth' \
        'subjectAltName = DNS:redis.platform-redis.svc.cluster.local,DNS:redis,DNS:localhost,IP:127.0.0.1' \
        > "$redis_ext"

      openssl genrsa -out "$ca_key" 2048 >/dev/null 2>&1
      openssl req -new -x509 -days 365 -key "$ca_key" -out "$ca_cert" -subj '/CN=platform-redis-local-ca' >/dev/null 2>&1
      openssl genrsa -out "$redis_key" 2048 >/dev/null 2>&1
      openssl req -new -key "$redis_key" -out "$redis_csr" -subj '/CN=redis.platform-redis.svc.cluster.local' -addext 'subjectAltName=DNS:redis.platform-redis.svc.cluster.local,DNS:redis,DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
      openssl x509 -req -in "$redis_csr" -CA "$ca_cert" -CAkey "$ca_key" -CAcreateserial -out "$redis_cert" -days 365 -extfile "$redis_ext" >/dev/null 2>&1

      apply_tls_secret redis-tls platform-redis "$redis_cert" "$redis_key"
      apply_configmap platform-root-ca platform-redis "rootCA.pem=$(cat "$ca_cert")"

      rm -rf "$tmp_dir"
    }

    propagate_platform_root_ca_to_tenants() {
      local root_ca
      root_ca="$(kubectl get configmap platform-root-ca -n platform-redis -o jsonpath='{.data.rootCA\.pem}' 2>/dev/null || true)"

      if [[ -z "$root_ca" ]]; then
        warn "platform-redis/platform-root-ca is missing; cannot propagate CA bundle to tenant namespaces"
        return 0
      fi

      local tenant_ns
      for tenant_ns in dq-dev dq-test maas-dev maas-test; do
        ensure_namespace "$tenant_ns"
        apply_configmap platform-root-ca "$tenant_ns" "rootCA.pem=$root_ca"
      done
    }

    main() {
      log "Starting platform secret initialization..."

      ensure_namespace platform-kong
      ensure_namespace platform-keycloak
      ensure_namespace platform-observability
      ensure_namespace platform-redis

      ensure_redis_tls_material
      propagate_platform_root_ca_to_tenants

      # --- Kong ---
      local kong_db_password
      kong_db_password=$(get_or_gen_password "kong-db-credentials" platform-kong "POSTGRES_PASSWORD")
      apply_secret kong-db-credentials platform-kong \
        "POSTGRES_DB=kong" \
        "POSTGRES_USER=kong" \
        "POSTGRES_PASSWORD=$kong_db_password" \
        "KONG_PG_DATABASE=kong" \
        "KONG_PG_USER=kong" \
        "KONG_PG_PASSWORD=$kong_db_password"

      local kong_admin_password
      kong_admin_password=$(get_or_gen_password "kong-admin-credentials" platform-kong "ADMIN_PASSWORD")
      apply_secret kong-admin-credentials platform-kong \
        "ADMIN_USERNAME=admin" \
        "ADMIN_PASSWORD=$kong_admin_password"

      # --- Keycloak ---
      local keycloak_admin_password
      keycloak_admin_password=$(get_or_gen_password "keycloak-admin" platform-keycloak "KEYCLOAK_ADMIN_PASSWORD")
      apply_secret keycloak-admin platform-keycloak \
        "KEYCLOAK_ADMIN=admin" \
        "KEYCLOAK_ADMIN_PASSWORD=$keycloak_admin_password"

      local keycloak_db_password
      keycloak_db_password=$(get_or_gen_password "keycloak-db-credentials" platform-keycloak "POSTGRES_PASSWORD")
      apply_secret keycloak-db-credentials platform-keycloak \
        "POSTGRES_DB=keycloak" \
        "POSTGRES_USER=keycloak" \
        "POSTGRES_PASSWORD=$keycloak_db_password" \
        "KC_DB_USERNAME=keycloak" \
        "KC_DB_PASSWORD=$keycloak_db_password"

      # --- Grafana ---
      local grafana_password
      grafana_password=$(get_or_gen_password "grafana-admin" platform-observability "GF_SECURITY_ADMIN_PASSWORD")
      apply_secret grafana-admin platform-observability \
        "GF_SECURITY_ADMIN_USER=admin" \
        "GF_SECURITY_ADMIN_PASSWORD=$grafana_password"

      # --- Redis (Platform Admin + Per-Principal) ---
      local redis_admin_password
      redis_admin_password=$(get_or_gen_password "redis-credentials" platform-redis "REDIS_ADMIN_PASSWORD")
      apply_secret redis-credentials platform-redis \
        "REDIS_ADMIN_USERNAME=platform-admin" \
        "REDIS_ADMIN_PASSWORD=$redis_admin_password"

      local dq_api_password
      dq_api_password=$(get_or_gen_password "redis-credentials-dq-api" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-api platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-api" \
        "REDIS_PASSWORD=$dq_api_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      local dq_engine_password
      dq_engine_password=$(get_or_gen_password "redis-credentials-dq-engine" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-engine platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-engine" \
        "REDIS_PASSWORD=$dq_engine_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      local dq_profiling_password
      dq_profiling_password=$(get_or_gen_password "redis-credentials-dq-profiling" platform-redis "REDIS_PASSWORD")
      apply_secret redis-credentials-dq-profiling platform-redis \
        "REDIS_HOST=redis.platform-redis.svc.cluster.local" \
        "REDIS_PORT=6379" \
        "REDIS_TLS_ENABLED=true" \
        "REDIS_USERNAME=dq-profiling" \
        "REDIS_PASSWORD=$dq_profiling_password" \
        "REDIS_KEY_PREFIX=dq-made-easy"

      ensure_redis_tls_material

      # --- Redis ACL ---
      local acl_content
      acl_content=$(printf '%s\n' \
        'user default off' \
        "user platform-admin on >${redis_admin_password} ~* &* +@all" \
        "user dq-api on >${dq_api_password} ~dq-made-easy:* +@all" \
        "user dq-engine on >${dq_engine_password} ~dq-made-easy:* +@all" \
        "user dq-profiling on >${dq_profiling_password} ~dq-made-easy:* +@all"
      )
      apply_secret redis-acl platform-redis "users.acl=$acl_content"

      info "All platform secrets initialized"
    }

    main "$@"
