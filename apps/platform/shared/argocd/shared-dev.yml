apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-shared
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: file:///repos/platform-argocd-apps
    targetRevision: HEAD
    path: apps/platform/shared/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-shared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
