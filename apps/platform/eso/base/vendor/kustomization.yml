apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ESO vendor manifests — namespace patches and arg fixes.
# No label injection (CRD annotation size limit).
#
# Flux ordering is handled by split Kustomizations with dependsOn:
#   platform-eso-crds.yaml → platform-eso-resources.yaml → platform-eso-controllers.yaml

namespace: platform-eso

resources:
  - external-secrets.yaml

patches:
  # CRDs — no sync-wave needed (Flux handles ordering via dependsOn)
  - target:
      kind: CustomResourceDefinition
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn

  # ServiceAccounts, Services, Roles, Secrets — no sync-wave needed
  - target:
      kind: ServiceAccount
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Service
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Secret
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Role
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: RoleBinding
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso

  # Deployments — no sync-wave needed
  - target:
      kind: Deployment
      name: external-secrets
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Deployment
      name: external-secrets-webhook
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --dns-name=external-secrets-webhook.platform-eso.svc
  - target:
      kind: Deployment
      name: external-secrets-cert-controller
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --service-namespace=platform-eso
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --secret-namespace=platform-eso

  # ValidatingWebhookConfigs — no sync-wave needed
  - target:
      kind: ValidatingWebhookConfiguration
    patch: |
      # No annotations needed — Flux handles ordering via dependsOn
