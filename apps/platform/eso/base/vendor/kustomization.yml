apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ESO vendor manifests — namespace patches and arg fixes.
# No label injection (CRD annotation size limit).

namespace: platform-eso

resources:
  - external-secrets.yaml

patches:
  # Fix namespace references in all resources
  - target:
      kind: Deployment
      name: external-secrets
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Deployment
      name: external-secrets-webhook
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Deployment
      name: external-secrets-cert-controller
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: --service-namespace=platform-eso
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --secret-namespace=platform-eso
  - target:
      kind: ServiceAccount
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Service
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Secret
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: Role
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
  - target:
      kind: RoleBinding
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-eso
