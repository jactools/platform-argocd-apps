apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ESO — External Secrets Operator v2.9.0
# Vendor CRDs are deployed without labels (256KB annotation limit).
# Platform resources (namespace, ClusterSecretStore, RBAC) get labels.

namespace: platform-eso

resources:
  - vendor
  - namespace.yml
  - cluster-secret-store.yml
  - rbac.yml

labels:
  - includeSelectors: false
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/service: eso
      platform.jaccloud.nl/tenant: platform
