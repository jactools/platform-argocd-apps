apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform service: Ingestion Runner
# Base manifests — secrets generated by scripts/generate_secrets.sh

commonLabels:
  platform.jaccloud.nl/managed-by: argocd
  platform.jaccloud.nl/service: ingestion-runner
  platform.jaccloud.nl/tenant: platform

resources:
  - namespace.yml
  - configmap.yml
  - deployment.yml
  - service.yml
  - ingress.yml

patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
  - target:
      kind: StatefulSet
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          platform.jaccloud.nl/target-id: CLUSTER
          platform.jaccloud.nl/workload-kind: service
          platform.jaccloud.nl/maas-register: "true"
