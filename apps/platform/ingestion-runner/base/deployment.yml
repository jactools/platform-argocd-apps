---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-runner
  labels:
    app.kubernetes.io/name: ingestion-runner
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-runner
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion-runner
          image: jacbeekers/platform-ingestion-runner:0.1.0
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingestion-runner-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
