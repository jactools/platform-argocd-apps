---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ai-stor-test
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: file:///repos/platform-argocd-apps
    targetRevision: release/test
    path: apps/platform/ai-stor/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ai-stor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
