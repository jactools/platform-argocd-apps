apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-ai-stor

resources:
  - namespace.yml
  - configmaps/ai-stor-init-script.yml
  - jobs/ai-stor-init-job.yml
  - ingress/kong-routes-reference.yml
  - deployment.yml
  - service.yml
  - headless-service.yml
  - configmap.yml
  - pvc.yml

labels:
  - pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/service: ai-stor
    includeSelectors: true
