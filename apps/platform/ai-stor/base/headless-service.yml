apiVersion: v1
kind: Service
metadata:
  name: ai-stor-headless
  labels:
    app.kubernetes.io/name: ai-stor
    app.kubernetes.io/part-of: platform-foundation
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: ai-stor
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
